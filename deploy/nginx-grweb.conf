# Include inside the existing site's server block.
# /var/www/grweb points to the extracted GRWeb release directory.
location = /grweb {
    return 308 /grweb/;
}

location ^~ /grweb/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;

    types {
        text/html                  html;
        text/css                   css;
        application/javascript     js;
        application/json           json;
        application/wasm           wasm;
        application/octet-stream   unityweb;
        text/plain                 md txt csv;
        image/png                  png;
        image/jpeg                 jpg jpeg;
        image/svg+xml              svg;
        image/x-icon               ico;
    }
    default_type application/octet-stream;

    # Unity's loader decompresses the .unityweb files itself.
    gzip off;

    # Filenames are reused by later builds: revalidate instead of caching forever.
    # expires preserves inherited security headers (unlike a new add_header block).
    expires -1;
    etag on;
    open_file_cache off;
}
